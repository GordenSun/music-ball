<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e2e0db">
<meta name="description" content="一颗小球在墙上弹跳，每一次碰撞都是一个音符。猜猜它弹的是哪 8 首歌？">
<title>音乐小球 · 猜猜是哪 8 首歌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f2511f'/%3E%3Cpath d='M6 12c7 2 13 2 20 0M5 19c8 3 14 3 22 0' stroke='%23ffd27a' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="ui">
  <header id="top">
    <div id="chip" class="pill"><b id="chipNo">第 1 / 8 首</b><span id="chipName">？？？</span></div>
    <div id="score" class="pill">猜对 <b id="scoreNum">0</b> / 8</div>
  </header>

  <div id="toast" class="pill"></div>

  <section id="quiz" hidden>
    <h2 id="quizTitle">这是什么歌？</h2>
    <div id="quizOpts"></div>
  </section>

  <footer id="bar">
    <div id="track">
      <div id="trackFill"></div>
      <div id="marks"></div>
      <div id="knob"></div>
    </div>
    <div id="row">
      <button id="play" class="icon" title="播放 / 暂停（空格）" aria-label="播放或暂停">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button id="prev" class="icon" title="上一首" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zM19 6v12l-9-6z"/></svg></button>
      <button id="next" class="icon" title="下一首" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 6v12l9-6z"/></svg></button>
      <span id="time">0:00 / 0:00</span>
      <span class="grow"></span>
      <button id="quizBtn" class="txt on" title="猜歌模式">猜歌</button>
      <button id="reveal" class="txt" title="显示歌名">歌名</button>
      <button id="speed" class="txt" title="播放速度">1×</button>
      <button id="mute" class="icon" title="静音（M）" aria-label="静音">
        <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.500 9.5zM14.500 8.200a5 5 0 0 1 0 7.600l1.300 1.400a7 7 0 0 0 0-10.400z"/></svg>
        <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.500 9.5zM15 9.400l1.400-1.400L18.500 10.100 20.600 8 22 9.400 19.900 11.500 22 13.600 20.600 15 18.500 12.900 16.400 15 15 13.600l2.100-2.100z"/></svg>
      </button>
      <button id="shuffle" class="icon" title="换一面墙（随机布局）" aria-label="随机布局"><svg viewBox="0 0 24 24"><path d="M16 4l4 3.500-4 3.500V8.500h-1.600l-6.200 8H4v-2h3.200l6.200-8H16zM4 6.500h4.200l1.900 2.400-1.300 1.600-1.600-2H4zM16 13l4 3.500-4 3.500v-2.500h-2.600l-1.900-2.400 1.300-1.600 1.600 2H16z"/></svg></button>
      <button id="fs" class="icon" title="全屏（F）" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zM14 5h5v5h-2V7h-3zM5 14h2v3h3v2H5zM17 14h2v5h-5v-2h3z"/></svg></button>
    </div>
  </footer>
</div>

<div id="start">
  <div id="card">
    <p class="kicker">MUSIC BALL</p>
    <h1>音乐小球</h1>
    <p class="sub">小球每撞一下，就是一个音符。<br>一共 8 首歌，你能猜对几首？</p>
    <button id="go">开始播放</button>
    <p class="hint">拖动旋转视角 · 滚轮 / 双指缩放 · 空格暂停</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
